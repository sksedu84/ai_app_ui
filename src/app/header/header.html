@if (state$ | async; as state) {
  @if (errorMessage$ | async; as errorMessage) {
    @if (errorMessage) {
      <div class="site-error" role="alert" aria-live="assertive">
        <p class="site-error__text">{{ errorMessage }}</p>
        <button class="site-error__close" type="button" (click)="clearError()" aria-label="Dismiss error message">
          Dismiss
        </button>
      </div>
    }
  }
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-header__brand">
        <div class="site-header__text">
          <h1 class="site-header__title">
            <a
              class="site-header__title-link"
              routerLink="/"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: true }"
              [class.is-disabled]="state.busy"
              [attr.aria-disabled]="state.busy"
              (click)="state.busy && $event.preventDefault()"
            >{{ title }}</a>
          </h1>
        </div>
      </div>

      <nav class="site-header__menu" aria-label="Main navigation">
        @for (item of menuItems; track item.text) {
          <a
            class="site-header__menu-link"
            [routerLink]="item.routerLink"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            [class.is-disabled]="state.busy"
            [attr.aria-disabled]="state.busy"
            (click)="state.busy && $event.preventDefault()"
          >
            {{ item.text }}
          </a>
        }
      </nav>
    </div>
  </header>
}
