<main class="app">

  <section class="app__output">
    @if (mode === 'rag') {
      <div #responseBox class="app__response"
           [innerHTML]="promptResponse.response">
      </div>
    }
  </section>

  <section class="app__input">
    <form class="prompt" (ngSubmit)="sendPrompt()">
      <textarea
        name="userPrompt"
        class="prompt__field"
        rows="2"
        placeholder="Your prompt goes here..."
        [(ngModel)]="userPrompt"
        [disabled]="isBusy"></textarea>

      <button
        type="submit"
        class="prompt__submit"
        [disabled]="!canPrompt">
        {{ submitText }}
      </button>
    </form>
  </section>
</main>
